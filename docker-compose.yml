services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-ledger-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-exam-predictor-production-secret-2026}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/../data
    networks:
      - exam-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-ledger-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - exam-network

networks:
  exam-network:
    driver: bridge
